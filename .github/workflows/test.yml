name: Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          locked: true

      - name: Run tests
        run: pixi run test

      - name: Run doctests
        run: pixi run doctest
